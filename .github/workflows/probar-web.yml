name: Probar marca web (Caddy)

# Se ejecuta al cambiar cumulo/servidor/web: construye el Caddy de Cúmulo y lo prueba contra una
# imitación de ThingsBoard, para verificar los reemplazos antes de instalarlo.
on:
  push:
    branches: [cumulo]
    paths:
      - "cumulo/servidor/web/**"
      - ".github/workflows/probar-web.yml"

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir imagen
        run: docker build -t cumulo-caddy cumulo/servidor/web

      - name: Probar reemplazos
        run: |
          set -e
          WEB=$GITHUB_WORKSPACE/cumulo/servidor/web
          mkdir -p /tmp/tb/assets && cd /tmp/tb
          printf '<!doctype html><html><head><title>ThingsBoard</title><style>.s{background-color: rgb(43,160,199);}</style></head><body>ThingsBoard</body></html>' > index.html
          printf '.a{color:#305680}.b{background:rgba(48, 86, 128, .5)}.c{color:#A7C1DE}.d{color:#FF5722}.e{color:rgba(255, 87, 34, .2)}' > styles-ABC.css
          for i in $(seq 200); do printf '.relleno%s{margin:0}' $i >> styles-ABC.css; done
          printf 'var x="#527DAD",y="rgb(82,125,173)";' > main-ABC.js
          echo viejo > assets/logo_title_white.svg
          echo viejo > thingsboard.ico
          python3 -m http.server 9000 >/dev/null 2>&1 &
          sed -e 's/^monitoreo.cumuloingenieria.com.ar {/:8081 {/' \
              -e 's/thingsboard-ce:8080/host.docker.internal:9000/' "$WEB/Caddyfile" > /tmp/Caddyfile
          if ! docker run --rm -v /tmp/Caddyfile:/etc/caddy/Caddyfile cumulo-caddy caddy validate --config /etc/caddy/Caddyfile > validar.txt 2>&1; then
            echo "::error title=Caddyfile inválido::$(grep -iE 'error|Error' validar.txt | tail -3 | tr '\n' ' ')"
            exit 1
          fi
          if ! docker run -d --name caddyweb --add-host host.docker.internal:host-gateway -p 8081:8081 \
            -v /tmp/Caddyfile:/etc/caddy/Caddyfile -v "$WEB/archivos":/srv/cumulo-web:ro cumulo-caddy > arranque.txt 2>&1; then
            echo "::error title=No arrancó Caddy::$(tail -3 arranque.txt | tr '\n' ' ')"
            exit 1
          fi
          sleep 3

          falla=0
          revisar() { if grep -qF -- "$2" "$1"; then echo "OK $3"; oks="$oks, $3"; else echo "::error::FALLA $3 — recibido: $(head -c 300 "$1" | tr '\n' ' ')"; falla=1; fi; }
          curl -s --compressed localhost:8081/ -o pagina.html
          curl -s --compressed localhost:8081/styles-ABC.css -o estilos.css
          curl -s --compressed localhost:8081/main-ABC.js -o main.js
          curl -s localhost:8081/assets/logo_title_white.svg -o logo.svg
          curl -s localhost:8081/thingsboard.ico -o icono.ico
          curl -s localhost:8081/cumulo-web/cumulo.js -o cumulo.js
          curl -s -o /dev/null -D cabeceras.txt -H 'Accept-Encoding: gzip' localhost:8081/styles-ABC.css
          cat pagina.html estilos.css main.js; echo; cat cabeceras.txt
          revisar pagina.html "<title>Cúmulo Monitoreo</title>" "título de la página"
          revisar pagina.html "/cumulo-web/cumulo.css" "hoja de estilos de Cúmulo"
          revisar pagina.html "rgb(63,110,166)" "color de la pantalla de carga"
          revisar estilos.css "#3f6ea6" "color principal en CSS"
          revisar estilos.css "63,110,166" "color principal rgba en CSS"
          revisar estilos.css "#b2c5db" "color claro en CSS"
          revisar estilos.css "#1e3552" "acento en CSS"
          revisar estilos.css "30,53,82" "acento rgba en CSS"
          revisar main.js "#6f99ca" "color secundario en JS"
          revisar main.js "111,153,202" "color secundario rgb en JS"
          revisar logo.svg "#FFFFFF" "logo de Cúmulo"
          revisar cumulo.js "MutationObserver" "script del título"
          revisar cabeceras.txt "Content-Encoding: gzip" "compresión hacia el navegador"
          cmp -s icono.ico "$WEB/archivos/favicon.ico" && oks="$oks, ícono" || { echo "::error::FALLA ícono"; falla=1; }
          echo "::notice title=Pruebas correctas::${oks#, }"
          [ $falla = 0 ] || echo "::error title=Registro de Caddy::$(docker logs caddyweb 2>&1 | grep -i error | tail -3 | tr '\n' ' ')"
          docker logs caddyweb 2>&1 | tail -20
          exit $falla

  # Prueba contra ThingsBoard real (la versión actual y la de destino)
  real:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tb: ["4.2.1.1", "4.3.1.8"]
    steps:
      - uses: actions/checkout@v4

      - name: Construir imagen
        run: docker build -t cumulo-caddy cumulo/servidor/web

      - name: Levantar ThingsBoard ${{ matrix.tb }}
        run: |
          if ! docker pull -q thingsboard/tb-postgres:${{ matrix.tb }} > tirar.txt 2>&1; then
            echo "::error title=Imagen ${{ matrix.tb }}::$(tail -2 tirar.txt | tr '\n' ' ')"; exit 1
          fi
          docker run -d --name tb -p 8080:9090 thingsboard/tb-postgres:${{ matrix.tb }}
          for i in $(seq 90); do
            curl -sf localhost:8080/login -o /dev/null && break
            sleep 5
          done
          curl -sf localhost:8080/login -o /dev/null || { echo "::error::ThingsBoard ${{ matrix.tb }} no arrancó: $(docker logs tb 2>&1 | grep -i error | tail -2 | tr '\n' ' ')"; exit 1; }

      - name: Probar marca contra ThingsBoard ${{ matrix.tb }}
        run: |
          WEB=$GITHUB_WORKSPACE/cumulo/servidor/web
          sed -e 's/^monitoreo.cumuloingenieria.com.ar {/:8081 {/' \
              -e 's/thingsboard-ce:8080/host.docker.internal:8080/' "$WEB/Caddyfile" > /tmp/Caddyfile
          docker run -d --name caddyweb --add-host host.docker.internal:host-gateway -p 8081:8081 \
            -v /tmp/Caddyfile:/etc/caddy/Caddyfile -v "$WEB/archivos":/srv/cumulo-web:ro cumulo-caddy
          sleep 3
          falla=0; oks=""
          ok() { oks="$oks, $1"; }
          mal() { echo "::error title=TB ${{ matrix.tb }}::$1"; falla=1; }

          curl -s localhost:8080/login -o original.html
          curl -s --compressed localhost:8081/login -o marca.html
          grep -qF "<title>Cúmulo Monitoreo</title>" marca.html && ok "título" || mal "título: $(grep -o '<title>[^<]*' marca.html)"
          grep -qF "cumulo-web/cumulo.css" marca.html && ok "estilos Cúmulo" || mal "no se insertó cumulo.css"
          grep -qF 'thingsboard.ico' original.html && ok "ruta del ícono" || mal "el ícono ya no es thingsboard.ico"

          css=$(grep -o 'styles[^"]*\.css' original.html | head -1)
          main=$(grep -o 'main[^"]*\.js' original.html | head -1)
          echo "css=$css main=$main"
          curl -s localhost:8080/$css -o css0; curl -s --compressed localhost:8081/$css -o css1
          curl -s localhost:8080/$main -o js0; curl -s --compressed localhost:8081/$main -o js1
          n0=$(grep -oi '#305680' css0 js0 | wc -l); n1=$(grep -oi '#305680' css1 js1 | wc -l); n2=$(grep -oi '#3f6ea6' css1 js1 | wc -l)
          echo "#305680 original=$n0 con marca=$n1; #3f6ea6 con marca=$n2"
          [ "$n0" -gt 0 ] && [ "$n1" = 0 ] && [ "$n2" -ge "$n0" ] && ok "color principal ($n0 lugares)" || mal "color principal: original=$n0 restante=$n1 nuevo=$n2"
          a0=$(grep -oi '#ff5722' css0 js0 | wc -l); a1=$(grep -oi '#ff5722' css1 js1 | wc -l)
          [ "$a1" = 0 ] && ok "acento ($a0 lugares)" || mal "acento: quedan $a1 de $a0"
          grep -rqF 'assets/logo_title_white.svg' js0 && ok "ruta del logo" || mal "el logo ya no es assets/logo_title_white.svg"
          grep -rqF 'tb-github-badge' js0 && ok "botón GitHub ocultable" || mal "ya no existe tb-github-badge"
          curl -s localhost:8081/assets/logo_title_white.svg | grep -qF '#FFFFFF' && ok "logo Cúmulo" || mal "no se sirve el logo de Cúmulo"

          # Inicio de sesión y websocket a través de Caddy
          token=$(curl -s -X POST localhost:8081/api/auth/login -H 'Content-Type: application/json' \
            -d '{"username":"tenant@thingsboard.org","password":"tenant"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')
          [ -n "$token" ] && ok "API a través de Caddy" || mal "falló el login por la API"
          pip install -q websockets >/dev/null 2>&1
          if python3 - "$token" <<'PY'
          import asyncio, sys, json, websockets
          async def main():
              async with websockets.connect("ws://localhost:8081/api/ws") as ws:
                  await ws.send(json.dumps({"authCmd": {"cmdId": 0, "token": sys.argv[1]}}))
                  await ws.send(json.dumps({"cmds": [{"type": "ALARM_COUNT", "cmdId": 1, "query": {}}]}))
                  print(await asyncio.wait_for(ws.recv(), 15))
          asyncio.run(main())
          PY
          then ok "websocket (datos en vivo)"; else mal "el websocket no funciona a través de Caddy"; fi

          echo "::notice title=TB ${{ matrix.tb }} correcto::${oks#, }"
          exit $falla
