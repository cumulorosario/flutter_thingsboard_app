name: Cúmulo Monitoreo — Build Android

# Se ejecuta a mano desde la pestaña "Actions", eligiendo APK o AAB.
on:
  workflow_dispatch:
    inputs:
      formato:
        description: "Qué generar"
        required: true
        default: apk
        type: choice
        options:
          - apk
          - appbundle

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Versión exacta de Flutter que exige esta versión de la app (ver .fvmrc)
      - name: Instalar Flutter 3.29.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.0"
          channel: stable
          cache: true

      - name: Descargar dependencias
        run: flutter pub get

      # Regenera ícono y pantalla de inicio a partir de assets/branding/
      - name: Generar ícono de la app
        run: dart run flutter_launcher_icons

      - name: Generar pantalla de inicio (splash)
        run: dart run flutter_native_splash:create

      - name: Compilar
        run: |
          flutter build ${{ inputs.formato }} --release \
            --dart-define-from-file=configs.json

      - name: Guardar el resultado
        uses: actions/upload-artifact@v5
        with:
          name: cumulo-monitoreo-${{ inputs.formato }}
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
