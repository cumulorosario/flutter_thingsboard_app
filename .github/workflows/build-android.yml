name: Cúmulo Monitoreo — Build Android

# Se ejecuta solo cada vez que se sube un cambio a la rama "cumulo" (genera APK),
# o a mano desde la pestaña "Actions", eligiendo APK o AAB.
on:
  push:
    branches: [cumulo]
    # Los cambios solo del servidor no necesitan una app nueva
    paths-ignore:
      - "cumulo/servidor/**"
      - ".github/workflows/probar-web.yml"
  workflow_dispatch:
    inputs:
      formato:
        description: "Qué generar"
        required: true
        default: apk
        type: choice
        options:
          - apk
          - appbundle

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Versión exacta de Flutter que exige esta versión de la app (ver .fvmrc)
      - name: Instalar Flutter 3.29.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.0"
          channel: stable
          cache: true

      # Aplica logos, colores, nombre y español sobre el código original
      # de ThingsBoard (todo lo de Cúmulo está en la carpeta cumulo/)
      - name: Aplicar personalización Cúmulo
        run: python3 cumulo/scripts/aplicar.py
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Descargar dependencias
        run: flutter pub get

      # Regenera ícono y pantalla de inicio a partir de assets/branding/
      - name: Generar ícono de la app
        run: dart run flutter_launcher_icons

      - name: Generar pantalla de inicio (splash)
        run: dart run flutter_native_splash:create

      - name: Compilar
        run: |
          # APK solo para procesadores de 64 bits (arm64): cualquier celular
          # de los últimos años. Un APK "universal" trae tres juntos y pesa el triple.
          set -o pipefail
          if [ "${{ inputs.formato || 'apk' }}" = "apk" ]; then
            flutter build apk --release --target-platform android-arm64 \
              --dart-define-from-file=cumulo/configs.json 2>&1 | tee build.log
          else
            flutter build appbundle --release \
              --dart-define-from-file=cumulo/configs.json 2>&1 | tee build.log
          fi

      # Si falla, deja los errores visibles en el resumen de la ejecución
      - name: Mostrar errores de compilación
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Exception" build.log | head -30 | while IFS= read -r linea; do
            echo "::error::${linea}"
          done

      - name: Guardar el resultado
        uses: actions/upload-artifact@v5
        with:
          name: cumulo-monitoreo-${{ inputs.formato || 'apk' }}
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
